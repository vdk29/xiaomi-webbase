<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>
        Xiaomi WebBase
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="app-header">

        <div class="header-inner">


            <div class="logo">

                <span class="logo-letter">
                    X
                </span>


                <div class="logo-text">

                    <strong>
                        Xiaomi
                    </strong>

                    <span>
                        WebBase
                    </span>

                </div>

            </div>


            <div class="header-info">

                База товаров

            </div>


        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="app-main">


        <!-- ==================================================
             PAGE HEADER
        ================================================== -->

        <section class="page-header">

            <div>

                <div class="page-label">
                    XIAOMI STORE
                </div>


                <h1>
                    Товары
                </h1>


                <p>
                    Наличие товаров на витрине и складе
                </p>

            </div>

        </section>



        <!-- ==================================================
             SEARCH
        ================================================== -->

        <section class="search-section">

            <div class="search-box">


                <input
                    type="search"
                    id="searchInput"
                    placeholder="Поиск товара..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="searchButton"
                    class="search-button"
                >

                    Поиск

                </button>


            </div>

        </section>



        <!-- ==================================================
             CATEGORIES
        ================================================== -->

        <section class="categories-section">


            <div class="category-buttons">


                <button
                    type="button"
                    class="category-button active"
                    data-category="Все"
                >
                    Все
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Смартфоны"
                >
                    Смартфоны
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Планшеты"
                >
                    Планшеты
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Смарт-часы"
                >
                    Смарт-часы
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Фитнес-браслеты"
                >
                    Фитнес-браслеты
                </button>


            </div>

        </section>



        <!-- ==================================================
             PRODUCTS
        ================================================== -->

        <section class="products-section">


            <div
                id="productsList"
                class="products-grid"
            >

                <!--
                    Товары автоматически
                    добавляются через app.js
                -->

            </div>


        </section>


    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="app-footer">


        <div class="footer-inner">


            <span>
                Xiaomi WebBase
            </span>


            <span>
                База наличия
            </span>


        </div>


    </footer>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!--
        СНАЧАЛА данные товаров.
        ПОТОМ логика приложения.
    -->

    <script src="products-data.js"></script>

    <script src="app.js"></script>


</body>

</html>
