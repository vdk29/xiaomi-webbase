<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Xiaomi WebBase</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">

        <div class="container header-container">

            <div>

                <div class="logo">
                    Xiaomi WebBase
                </div>

                <div class="subtitle">
                    Внутренняя база магазина
                </div>

            </div>



        </div>

    </header>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="main">

        <div class="container">


            <!-- SEARCH -->

            <section class="search-section">

                <h1>
                    Поиск товара
                </h1>


                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Введите название товара..."
                        autocomplete="off"
                    >


                    <button
                        type="button"
                        id="searchButton"
                    >
                        Найти
                    </button>

                </div>

            </section>



            <!-- CATEGORIES -->

            <section class="categories">

                <h2>
                    Категории
                </h2>


                <div class="category-list">


                    <button
                        type="button"
                        class="category-button active"
                        data-category="Все"
                    >
                        Все товары
                    </button>


                    <button
                        type="button"
                        class="category-button"
                        data-category="Смартфоны"
                    >
                        Смартфоны
                    </button>


                    <button
                        type="button"
                        class="category-button"
                        data-category="Планшеты"
                    >
                        Планшеты
                    </button>


                    <button
                        type="button"
                        class="category-button"
                        data-category="Смарт-часы"
                    >
                        Смарт-часы
                    </button>


                    <button
                        type="button"
                        class="category-button"
                        data-category="Фитнес-браслеты"
                    >
                        Фитнес-браслеты
                    </button>


                    <button
                        type="button"
                        class="category-button"
                        data-category="Аксессуары"
                    >
                        Аксессуары
                    </button>

                </div>

            </section>



            <!-- PRODUCTS -->

            <section class="products">

                <div class="section-title">

                    <h2>
                        Товары
                    </h2>

                </div>


                <div
                    id="productsList"
                    class="products-list"
                >

                </div>

            </section>


        </div>

    </main>



    <!-- ==========================================
         ADD / EDIT PRODUCT MODAL
    =========================================== -->

    <div
        id="productModal"
        class="modal-overlay"
    >

        <div
            class="product-modal"
            role="dialog"
            aria-modal="true"
        >


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <div>

                    <div
                        id="modalTitle"
                        class="modal-title"
                    >
                        Добавить товар
                    </div>

                    <div class="modal-subtitle">
                        Информация о товаре
                    </div>

                </div>


                <button
                    type="button"
                    id="closeProductModal"
                    class="modal-close"
                >
                    ×
                </button>

            </div>



            <!-- FORM -->

            <form
                id="productForm"
                class="product-form"
            >


                <!-- ОСНОВНОЕ -->

                <div class="form-section">

                    <div class="form-section-title">
                        Основная информация
                    </div>


                    <label class="form-label">
                        Название товара

                        <input
                            type="text"
                            id="productName"
                            required
                            placeholder="Например: Xiaomi 17 Ultra"
                        >

                    </label>


                    <label class="form-label">
                        Категория

                        <select
                            id="productCategory"
                            required
                        >

                            <option value="Смартфоны">
                                Смартфоны
                            </option>

                            <option value="Планшеты">
                                Планшеты
                            </option>

                            <option value="Смарт-часы">
                                Смарт-часы
                            </option>

                            <option value="Фитнес-браслеты">
                                Фитнес-браслеты
                            </option>

                            <option value="Аксессуары">
                                Аксессуары
                            </option>

                        </select>

                    </label>


                    <label class="form-label">
                        Цвет

                        <input
                            type="text"
                            id="productColor"
                            placeholder="Например: Black"
                        >

                    </label>

                </div>



                <!-- ХАРАКТЕРИСТИКИ -->

                <div class="form-section">

                    <div class="form-section-title">
                        Характеристики
                    </div>


                    <label class="form-label">

                        Встроенная память

                        <input
                            type="text"
                            id="specStorage"
                            placeholder="Например: 512 GB"
                        >

                    </label>


                    <label class="form-label">

                        Дисплей

                        <input
                            type="text"
                            id="specDisplay"
                            placeholder="Например: 6.9 AMOLED"
                        >

                    </label>


                    <label class="form-label">

                        Процессор

                        <input
                            type="text"
                            id="specProcessor"
                            placeholder="Например: Snapdragon 8 Elite"
                        >

                    </label>


                    <label class="form-label">

                        Фотокамера

                        <input
                            type="text"
                            id="specCamera"
                            placeholder="Например: 200 Мп"
                        >

                    </label>


                    <label class="form-label">

                        Ёмкость аккумулятора

                        <input
                            type="text"
                            id="specBattery"
                            placeholder="Например: 6000 мАч"
                        >

                    </label>


                    <label class="form-label">

                        Оперативная память

                        <input
                            type="text"
                            id="specRam"
                            placeholder="Например: 16 GB"
                        >

                    </label>

                </div>



                <!-- НАЛИЧИЕ -->

                <div class="form-section">

                    <div class="form-section-title">
                        Наличие
                    </div>


                    <div class="form-grid-2">


                        <label class="form-label">

                            На витрине

                            <input
                                type="number"
                                id="productDisplay"
                                min="0"
                                value="0"
                            >

                        </label>


                        <label class="form-label">

                            На складе

                            <input
                                type="number"
                                id="productWarehouse"
                                min="0"
                                value="0"
                            >

                        </label>


                    </div>


                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="productLdu"
                        >

                        <span>
                            Есть LDU / демонстрационный экземпляр
                        </span>

                    </label>

                </div>



                <!-- ОПИСАНИЕ -->

                <div class="form-section">

                    <div class="form-section-title">
                        Дополнительная информация
                    </div>


                    <label class="form-label">

                        Краткое описание

                        <textarea
                            id="productDescription"
                            rows="4"
                            placeholder="Краткая информация о товаре..."
                        ></textarea>

                    </label>


                    <label class="form-label">

                        Подсказка продавцу

                        <textarea
                            id="productTip"
                            rows="4"
                            placeholder="Например: Один экземпляр на витрине..."
                        ></textarea>

                    </label>

                </div>



                <!-- ФОТО -->

                <div class="form-section">

                    <div class="form-section-title">
                        Фотография товара
                    </div>


                    <label
                        for="productPhoto"
                        class="photo-upload"
                    >

                        <span class="photo-upload-icon">
                            +
                        </span>

                        <span>
                            Выбрать фотографию
                        </span>

                    </label>


                    <input
                        type="file"
                        id="productPhoto"
                        accept="image/*"
                        hidden
                    >


                    <div
                        id="photoPreview"
                        class="photo-preview"
                    >

                    </div>

                </div>



                <!-- ACTIONS -->

                <div class="modal-actions">


                    <button
                        type="button"
                        id="cancelProductButton"
                        class="button-secondary"
                    >
                        Отмена
                    </button>


                    <button
                        type="submit"
                        class="button-primary"
                    >
                        Сохранить товар
                    </button>

                </div>


            </form>

        </div>

    </div>



    <!-- ==========================================
         SCRIPTS
         
         ВАЖНО:
         СНАЧАЛА БАЗА ТОВАРОВ
         ПОТОМ APP.JS
    =========================================== -->

    <script src="products-data.js"></script>

    <script src="app.js"></script>


</body>

</html>
