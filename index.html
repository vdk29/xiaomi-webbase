<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Xiaomi WebBase</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="container header-container">

            <div>

                <div class="logo">
                    Xiaomi WebBase
                </div>

                <div class="subtitle">
                    Внутренняя база магазина
                </div>

            </div>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">

        <div class="container">


            <!-- =====================================
                 SEARCH
            ====================================== -->

            <section class="search-section">

                <h1>
                    Поиск товара
                </h1>


                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Введите название товара..."
                        autocomplete="off"
                    >


                    <button
                        id="searchButton"
                        type="button"
                    >
                        Найти
                    </button>

                </div>

            </section>


            <!-- =====================================
                 CATEGORIES
            ====================================== -->

            <section class="categories">

                <h2>
                    Категории
                </h2>


                <div class="category-list">


                    <button
                        class="category-button active"
                        data-category="Все"
                        type="button"
                    >
                        Все товары
                    </button>


                    <button
                        class="category-button"
                        data-category="Смартфоны"
                        type="button"
                    >
                        Смартфоны
                    </button>


                    <button
                        class="category-button"
                        data-category="Планшеты"
                        type="button"
                    >
                        Планшеты
                    </button>


                    <button
                        class="category-button"
                        data-category="Смарт-часы"
                        type="button"
                    >
                        Смарт-часы
                    </button>


                    <button
                        class="category-button"
                        data-category="Фитнес-браслеты"
                        type="button"
                    >
                        Фитнес-браслеты
                    </button>


                    <button
                        class="category-button"
                        data-category="Аксессуары"
                        type="button"
                    >
                        Аксессуары
                    </button>


                </div>

            </section>


            <!-- =====================================
                 PRODUCTS
            ====================================== -->

            <section class="products">


                <div class="section-title">

                    <h2>
                        Товары
                    </h2>

                </div>


                <div
                    id="productsList"
                    class="products-list"
                >

                    <!--
                        Товары автоматически
                        загружаются через app.js
                    -->

                </div>


            </section>


        </div>

    </main>


    <!-- =========================================
         SCRIPTS

         Сначала загружаем базу товаров,
         затем основной JS.
    ========================================== -->

    <script src="products-data.js"></script>

    <script src="app.js"></script>


</body>

</html>
