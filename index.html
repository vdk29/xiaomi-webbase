<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Xiaomi WebBase</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container header-container">

            <div>

                <div class="logo">
                    Xiaomi WebBase
                </div>

                <div class="subtitle">
                    Внутренняя база магазина
                </div>

            </div>


            <button
                id="addProductButton"
                class="add-product-button"
                type="button"
            >
                + Добавить товар
            </button>

        </div>

    </header>



    <!-- MAIN -->

    <main class="main">

        <div class="container">


            <!-- SEARCH -->

            <section class="search-section">

                <h1>
                    Поиск товара
                </h1>


                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Введите название товара..."
                        autocomplete="off"
                    >


                    <button
                        id="searchButton"
                        type="button"
                    >
                        Найти
                    </button>

                </div>

            </section>



            <!-- CATEGORIES -->

            <section class="categories">

                <h2>
                    Категории
                </h2>


                <div class="category-list">


                    <button
                        class="category-button active"
                        data-category="Все"
                        type="button"
                    >
                        Все товары
                    </button>


                    <button
                        class="category-button"
                        data-category="Смартфоны"
                        type="button"
                    >
                        Смартфоны
                    </button>


                    <button
                        class="category-button"
                        data-category="Планшеты"
                        type="button"
                    >
                        Планшеты
                    </button>


                    <button
                        class="category-button"
                        data-category="Смарт-часы"
                        type="button"
                    >
                        Смарт-часы
                    </button>


                    <button
                        class="category-button"
                        data-category="Фитнес-браслеты"
                        type="button"
                    >
                        Фитнес-браслеты
                    </button>


                    <button
                        class="category-button"
                        data-category="Аксессуары"
                        type="button"
                    >
                        Аксессуары
                    </button>


                </div>

            </section>



            <!-- PRODUCTS -->

            <section class="products">

                <div class="section-title">

                    <h2>
                        Товары
                    </h2>

                </div>


                <div
                    id="productsList"
                    class="products-list"
                >

                </div>

            </section>


        </div>

    </main>



    <!-- ==================================================
         MODAL
    ================================================== -->

    <div
        id="productModal"
        class="modal"
    >


        <div
            class="modal-overlay"
            id="modalOverlay"
        ></div>


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
        >


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <div>

                    <h2 id="modalTitle">
                        Добавить товар
                    </h2>

                    <p>
                        Информация о товаре
                    </p>

                </div>


                <button
                    id="closeModalButton"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>



            <!-- FORM -->

            <form id="productForm">


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="productCategory">
                        Категория
                    </label>


                    <select
                        id="productCategory"
                        required
                    >

                        <option value="">
                            Выберите категорию
                        </option>

                        <option value="Смартфоны">
                            Смартфоны
                        </option>

                        <option value="Планшеты">
                            Планшеты
                        </option>

                        <option value="Смарт-часы">
                            Смарт-часы
                        </option>

                        <option value="Фитнес-браслеты">
                            Фитнес-браслеты
                        </option>

                        <option value="Аксессуары">
                            Аксессуары
                        </option>

                    </select>

                </div>



                <!-- NAME -->

                <div class="form-group">

                    <label for="productName">
                        Название товара
                    </label>


                    <input
                        type="text"
                        id="productName"
                        placeholder="Например: Xiaomi 17 Ultra"
                        required
                    >

                </div>



                <!-- MEMORY / VERSION -->

                <div class="form-group">

                    <label for="productMemory">
                        Память / версия
                    </label>


                    <input
                        type="text"
                        id="productMemory"
                        placeholder="Например: 16 / 512 GB"
                    >

                </div>



                <!-- COLOR -->

                <div class="form-group">

                    <label for="productColor">
                        Цвет
                    </label>


                    <input
                        type="text"
                        id="productColor"
                        placeholder="Например: Black"
                    >

                </div>



                <!-- ==================================================
                     CHARACTERISTICS
                ================================================== -->

                <div class="form-section-title">
                    Характеристики
                </div>


                <div class="fixed-specs">


                    <div class="form-group">

                        <label for="specStorage">
                            Встроенная память
                        </label>


                        <input
                            type="text"
                            id="specStorage"
                            placeholder="Например: 512 GB"
                        >

                    </div>



                    <div class="form-group">

                        <label for="specDisplay">
                            Дисплей
                        </label>


                        <input
                            type="text"
                            id="specDisplay"
                            placeholder="Например: 6.73&quot; AMOLED"
                        >

                    </div>



                    <div class="form-group">

                        <label for="specProcessor">
                            Процессор
                        </label>


                        <input
                            type="text"
                            id="specProcessor"
                            placeholder="Например: Snapdragon 8 Elite"
                        >

                    </div>



                    <div class="form-group">

                        <label for="specCamera">
                            Фотокамера
                        </label>


                        <input
                            type="text"
                            id="specCamera"
                            placeholder="Например: 50 + 50 + 200 Мп"
                        >

                    </div>



                    <div class="form-group">

                        <label for="specBattery">
                            Ёмкость аккумулятора
                        </label>


                        <input
                            type="text"
                            id="specBattery"
                            placeholder="Например: 5410 мА·ч"
                        >

                    </div>



                    <div class="form-group">

                        <label for="specRam">
                            Оперативная память
                        </label>


                        <input
                            type="text"
                            id="specRam"
                            placeholder="Например: 16 GB"
                        >

                    </div>


                </div>



                <!-- ==================================================
                     STOCK
                ================================================== -->

                <div class="form-section-title">
                    Наличие
                </div>


                <div class="form-grid">


                    <div class="form-group">

                        <label for="productDisplay">
                            Витрина
                        </label>


                        <input
                            type="number"
                            id="productDisplay"
                            value="0"
                            min="0"
                        >

                    </div>


                    <div class="form-group">

                        <label for="productWarehouse">
                            Склад
                        </label>


                        <input
                            type="number"
                            id="productWarehouse"
                            value="0"
                            min="0"
                        >

                    </div>


                    <div class="form-group">

                        <label for="productLdu">
                            LDU
                        </label>


                        <input
                            type="number"
                            id="productLdu"
                            value="0"
                            min="0"
                        >

                    </div>


                </div>



                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="productDescription">
                        Кратко
                    </label>


                    <textarea
                        id="productDescription"
                        rows="3"
                        placeholder="Краткое описание товара..."
                    ></textarea>

                </div>



                <!-- TIP -->

                <div class="form-group">

                    <label for="productTip">
                        Подсказка продавцу
                    </label>


                    <textarea
                        id="productTip"
                        rows="3"
                        placeholder="Например: Один экземпляр на витрине, остальные на складе."
                    ></textarea>

                </div>



                <!-- PHOTO -->

                <div class="form-group">

                    <label for="productImage">
                        Фото товара
                    </label>


                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                    >


                    <div
                        id="imagePreview"
                        class="image-preview"
                    ></div>

                </div>



                <!-- BUTTONS -->

                <div class="form-buttons">


                    <button
                        type="button"
                        id="cancelProductButton"
                        class="cancel-button"
                    >
                        Отмена
                    </button>


                    <button
                        type="submit"
                        class="save-product-button"
                    >
                        Сохранить товар
                    </button>


                </div>


            </form>

        </div>

    </div>



    <!-- SCRIPTS -->

    <script src="products-data.js"></script>

    <script src="app.js"></script>


</body>

</html>
