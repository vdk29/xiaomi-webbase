<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>
        Xiaomi WebBase
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="app-header">

        <div class="header-inner">

            <div class="logo">

                <span class="logo-letter">
                    X
                </span>

                <div class="logo-text">

                    <strong>
                        Xiaomi
                    </strong>

                    <span>
                        WebBase
                    </span>

                </div>

            </div>


            <div class="header-info">

                База товаров

            </div>

        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="app-main">


        <section class="page-header">

            <div>

                <div class="page-label">
                    XIAOMI STORE
                </div>

                <h1>
                    Товары
                </h1>

                <p>
                    Наличие товаров на витрине и складе
                </p>

            </div>

        </section>



        <!-- ==================================================
             SEARCH
        ================================================== -->

        <section class="search-section">

            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Поиск товара..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="searchButton"
                    class="search-button"
                >
                    Поиск
                </button>

            </div>

        </section>



        <!-- ==================================================
             CATEGORIES
        ================================================== -->

        <section class="categories-section">

            <div class="category-buttons">

                <button
                    type="button"
                    class="category-button active"
                    data-category="Все"
                >
                    Все
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Смартфоны"
                >
                    Смартфоны
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Планшеты"
                >
                    Планшеты
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Смарт-часы"
                >
                    Смарт-часы
                </button>


                <button
                    type="button"
                    class="category-button"
                    data-category="Фитнес-браслеты"
                >
                    Фитнес-браслеты
                </button>

            </div>

        </section>



        <!-- ==================================================
             PRODUCTS
        ================================================== -->

        <section class="products-section">

            <div
                id="productsList"
                class="products-grid"
            >

                <div
                    style="
                        padding: 30px;
                        margin: 20px;
                        background: white;
                        color: black;
                        border: 3px solid orange;
                        border-radius: 16px;
                        font-size: 18px;
                    "
                >

                    Загрузка базы...

                </div>

            </div>

        </section>


    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="app-footer">

        <div class="footer-inner">

            <span>
                Xiaomi WebBase
            </span>

            <span>
                База наличия
            </span>

        </div>

    </footer>



    <!-- ==================================================
         PRODUCT DATA
    ================================================== -->

    <script src="./product-data.js"></script>



    <!-- ==================================================
         TEST SCRIPT
    ================================================== -->

    <script>

        const list =
            document.getElementById(
                "productsList"
            );


        console.log(
            "Проверка product-data.js"
        );


        console.log(
            "products:",
            typeof products !== "undefined"
                ? products
                : "НЕ НАЙДЕН"
        );


        if (
            typeof products === "undefined"
        ) {

            list.innerHTML = `

                <div
                    style="
                        padding: 30px;
                        margin: 20px;
                        background: white;
                        color: red;
                        border: 3px solid red;
                        border-radius: 16px;
                        font-size: 18px;
                    "
                >

                    <strong>
                        ОШИБКА
                    </strong>

                    <p>
                        product-data.js
                        не загрузился.
                    </p>

                </div>

            `;

        }

        else {

            if (
                products.length === 0
            ) {

                list.innerHTML = `

                    <div
                        style="
                            padding: 30px;
                            margin: 20px;
                            background: white;
                            color: black;
                            border: 3px solid orange;
                            border-radius: 16px;
                            font-size: 18px;
                        "
                    >

                        База загружена,
                        но товаров нет.

                    </div>

                `;

            }

            else {

                list.innerHTML = "";


                products.forEach(
                    product => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.style.cssText = `

                            background: white;

                            color: black;

                            padding: 25px;

                            margin: 20px;

                            border-radius: 18px;

                            border: 3px solid orange;

                            box-shadow:
                                0 5px 20px
                                rgba(0,0,0,0.15);

                            font-family:
                                Arial, sans-serif;

                        `;


                        card.innerHTML = `

                            <div
                                style="
                                    font-size: 14px;
                                    color: #777;
                                    margin-bottom: 8px;
                                "
                            >

                                ${product.category || ""}

                            </div>


                            <h2
                                style="
                                    margin: 0 0 10px 0;
                                "
                            >

                                ${product.name || "Без названия"}

                            </h2>


                            <div
                                style="
                                    margin-bottom: 15px;
                                "
                            >

                                ${
                                    product.memory || ""
                                }

                                ${
                                    product.memory &&
                                    product.color
                                        ? " · "
                                        : ""
                                }

                                ${
                                    product.color || ""
                                }

                            </div>


                            <div
                                style="
                                    display: grid;
                                    gap: 8px;
                                "
                            >

                                <div>

                                    Витрина:
                                    <strong>
                                        ${product.display || 0}
                                    </strong>

                                </div>


                                <div>

                                    Склад:
                                    <strong>
                                        ${product.warehouse || 0}
                                    </strong>

                                </div>


                                <div>

                                    Всего:
                                    <strong>
                                        ${
                                            Number(product.display || 0) +
                                            Number(product.warehouse || 0)
                                        }
                                    </strong>

                                </div>

                            </div>

                        `;


                        list.appendChild(
                            card
                        );

                    }
                );

            }

        }

    </script>



</body>

</html>
