<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>
        Xiaomi WebBase
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="app-header">

        <div class="header-inner">

            <div class="logo">

                <span class="logo-letter">
                    X
                </span>

                <div class="logo-text">

                    <strong>
                        Xiaomi
                    </strong>

                    <span>
                        WebBase
                    </span>

                </div>

            </div>


            <div class="header-info">
                База товаров
            </div>

        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="app-main">


        <!-- ==================================================
             PAGE HEADER
        ================================================== -->

        <section class="page-header">

            <div>

                <div class="page-label">
                    XIAOMI STORE
                </div>

                <h1>
                    Товары
                </h1>

                <p>
                    Наличие товаров на витрине и складе
                </p>

            </div>

        </section>



        <!-- ==================================================
             ЗАГРУЗКА БАЗЫ 1С
        ================================================== -->

        <section class="import-section">

            <div class="import-box">

                <div class="import-title">
                    Загрузка базы из 1С
                </div>


                <div class="import-description">

                    Загрузите выгрузку товаров из 1С.
                    Сайт автоматически обработает таблицу
                    и создаст карточки товаров.

                </div>


                <label
                    for="fileInput"
                    class="import-button"
                >

                    Выбрать файл 1С

                </label>


                <input
                    type="file"
                    id="fileInput"
                    accept=".xlsx,.xls,.csv"
                    hidden
                >


                <div
                    id="fileName"
                    class="import-file-name"
                >
                    Файл не выбран
                </div>


                <div
                    id="importStatus"
                    class="import-status"
                ></div>

            </div>

        </section>



        <!-- ==================================================
             SEARCH
        ================================================== -->

        <section class="search-section">

            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Поиск товара..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="searchButton"
                    class="search-button"
                >

                    Поиск

                </button>

            </div>

        </section>



        <!-- ==================================================
             CATEGORIES
        ================================================== -->

        <section class="categories-section">

            <div class="category-buttons">


                <!-- ВСЕ -->

                <button
                    type="button"
                    class="category-button active"
                    data-category="Все"
                >
                    Все
                </button>


                <!-- СМАРТФОНЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Смартфоны"
                >
                    Смартфоны
                </button>


                <!-- ПЛАНШЕТЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Планшеты"
                >
                    Планшеты
                </button>


                <!-- СМАРТ-ЧАСЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Смарт-часы"
                >
                    Смарт-часы
                </button>


                <!-- ФИТНЕС-БРАСЛЕТЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Фитнес-браслеты"
                >
                    Фитнес-браслеты
                </button>


                <!-- НАУШНИКИ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Наушники"
                >
                    Наушники
                </button>


                <!-- ТЕЛЕВИЗОРЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Телевизоры"
                >
                    Телевизоры
                </button>


                <!-- КАМЕРЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Камеры"
                >
                    Камеры
                </button>


                <!-- ПЫЛЕСОСЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Пылесосы"
                >
                    Пылесосы
                </button>


                <!-- АКСЕССУАРЫ -->

                <button
                    type="button"
                    class="category-button"
                    data-category="Аксессуары"
                >
                    Аксессуары
                </button>


            </div>

        </section>



        <!-- ==================================================
             PRODUCTS
        ================================================== -->

        <section class="products-section">

            <div
                id="productsList"
                class="products-grid"
            >

                <!--
                    Сюда JavaScript автоматически
                    загрузит товары.
                -->

            </div>

        </section>


    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="app-footer">

        <div class="footer-inner">

            <span>
                Xiaomi WebBase
            </span>

            <span>
                База наличия
            </span>

        </div>

    </footer>



    <!-- ==================================================
         БИБЛИОТЕКА ДЛЯ EXCEL
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
    ></script>



    <!-- ==================================================
         PRODUCTS DATA
    ================================================== -->

    <script src="products-data.js"></script>


    <!-- ==================================================
         APP
    ================================================== -->

    <script src="app.js"></script>


</body>

</html>
