<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>
        Товар — Xiaomi WebBase
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="app-header">

        <div class="header-inner">

            <button
                type="button"
                class="back-button"
                data-back
            >

                ←

                <span>
                    Назад
                </span>

            </button>


            <div class="logo">

                <span class="logo-letter">
                    X
                </span>

                <div class="logo-text">

                    <strong>
                        Xiaomi
                    </strong>

                    <span>
                        WebBase
                    </span>

                </div>

            </div>


            <div class="header-info">

                Товар

            </div>

        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="app-main product-main">


        <!-- ==================================================
             PRODUCT DETAILS
        ================================================== -->

        <section
            id="productDetails"
            class="product-details"
        >

            <!--
                Информация о товаре автоматически
                загружается через app.js
                по ID из адресной строки.

                Например:

                product.html?id=1001
            -->

        </section>


    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="app-footer">

        <div class="footer-inner">

            <span>
                Xiaomi WebBase
            </span>

            <span>
                Карточка товара
            </span>

        </div>

    </footer>



    <!-- ==================================================
         SCRIPTS
    ================================================== -->

    <!--
        Сначала загружаем базу товаров.
        Потом приложение.

        ПОРЯДОК НЕ МЕНЯТЬ.
    -->

    <script src="product-data.js?v=3"></script>
<script src="app.js?v=3"></script>


</body>

</html>
