<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>
        Товар — Xiaomi WebBase
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="app-header">


        <div class="header-inner">


            <button
                type="button"
                class="back-button"
                data-back
            >

                <span class="back-arrow">
                    ←
                </span>


                <span>
                    Назад
                </span>

            </button>



            <div class="logo">

                <span class="logo-letter">
                    X
                </span>


                <div class="logo-text">

                    <strong>
                        Xiaomi
                    </strong>


                    <span>
                        WebBase
                    </span>

                </div>

            </div>



            <div class="header-info">

                Товар

            </div>


        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="app-main product-main">


        <!-- ==================================================
             PRODUCT DETAILS
        ================================================== -->

        <section
            id="productDetails"
            class="product-details"
        >

            <!--
                Карточка товара автоматически
                создаётся через app.js.

                Пример:

                product.html?id=1001
            -->

        </section>


    </main>



    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="app-footer">


        <div class="footer-inner">


            <span>
                Xiaomi WebBase
            </span>


            <span>
                Карточка товара
            </span>


        </div>


    </footer>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <!--
        СНАЧАЛА загружаются данные.
        ПОТОМ загружается логика приложения.
    -->

    <script src="products-data.js"></script>

    <script src="app.js"></script>


</body>

</html>
